name: Setup and build

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      run: npm --color ci
      shell: bash

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 3.1.74

    - name: Build
      run: npm --color run build
      shell: bash
